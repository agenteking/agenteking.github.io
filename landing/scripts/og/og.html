<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Geist; src: url("geist.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "InstrSerif"; src: url("serif.woff2") format("woff2"); font-style: italic; }
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Geist,system-ui,sans-serif;background:#F6F5FA;color:#0D0D11;position:relative}
  .glow{position:absolute;inset:0;background:radial-gradient(520px 340px at 88% 18%,rgba(124,92,255,.32),transparent 70%),radial-gradient(500px 300px at 8% 100%,rgba(185,163,255,.35),transparent 70%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(38,37,45,.06) 1px,transparent 1px),linear-gradient(to bottom,rgba(38,37,45,.06) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 60% 30%,#000 10%,transparent 75%)}
  .wrap{position:relative;padding:72px 80px;height:100%;box-sizing:border-box;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:650;letter-spacing:-.03em}
  h1{margin:auto 0 0;font-size:84px;line-height:1.0;letter-spacing:-.045em;font-weight:640}
  h1 em{font-family:"InstrSerif",serif;font-weight:400;letter-spacing:-.01em;background:linear-gradient(100deg,#7C5CFF,#4A31B8);-webkit-background-clip:text;color:transparent;font-size:1.08em}
  p{margin:26px 0 0;font-size:28px;color:#5D5B6A;letter-spacing:-.01em}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="brand">
    <svg width="56" height="56" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6DFF"/><stop offset="1" stop-color="#5B3FD9"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M16 26.5s-7.6-6.3-7.6-12.4a7.6 7.6 0 0 1 15.2 0c0 6.1-7.6 12.4-7.6 12.4z" fill="#fff"/><path d="M16 9.9l1.15 2.95 2.95 1.15-2.95 1.15L16 18.1l-1.15-2.95L11.9 14l2.95-1.15z" fill="#6E4BF2"/></svg>
    <span id="brand">BRAND</span>
  </div>
  <h1>Que te encuentren.<br><em>Que te elijan.</em><br>Que te reserven.</h1>
  <p>Webs con turnos y pedidos para comercios y profesionales.</p>
</div>
<script>document.getElementById("brand").textContent = new URLSearchParams(location.search).get("brand") || "Aparece";</script>
</body></html>
