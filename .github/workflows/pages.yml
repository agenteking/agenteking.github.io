name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # VITE_* de landing/ (valores de landing/.env.example, sin secretos), salvo precios y link a la demo.
      VITE_BRAND_NAME: Aparece
      VITE_SITE_URL: https://agenteking.github.io
      VITE_CONTACT_EMAIL: agente.kingk@gmail.com
      VITE_WHATSAPP: ""
      VITE_NOINDEX: "1"
      VITE_SHOW_PRICES: "1"
      VITE_DEMO_URL: /selkis-estudio/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            landings/*/package-lock.json

      - name: Build estático (landing + landings/*)
        run: bash scripts/build-pages.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true # .nojekyll (desde v4 los dotfiles se excluyen por defecto)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
